# Outclaw Configuration 🦞
# "The Rulebook"

# ------------------------------------------------------------------------------
# 🎛️ Operation Mode
# strict: BLOCK threats (Default)
# audit:  LOG threats only (Allows all traffic)
# ------------------------------------------------------------------------------
mode: strict

# ------------------------------------------------------------------------------
# 🛡️ Driver Status
# Enable or disable specific security layers.
# ------------------------------------------------------------------------------
drivers:
  tool_guard: true   # Blocks dangerous shell commands
  # file_guard: deprecated
  workspace_guard: true # Blocks out-of-scope writes
  network_guard: true # Blocks malicious domains
  llm_guard: true    # ML-based scanning (see ml_guard below)
  secret_guard: true # Blocks API key leaks (detect-secrets)
  pii_guard: true    # Redacts PII (Presidio NER)

# ------------------------------------------------------------------------------
# 🧠 ML Guard Mode
# Controls which ML scanning backend is loaded when llm_guard is enabled.
#   light: LlamaFirewall / PromptGuard 2 (~90MB model, fast)
#   full:  llm-guard ONNX suite (~500MB+, pip install outclaw[heavy])
#   off:   No ML scanning (regex guards still active)
# ------------------------------------------------------------------------------
ml_guard: light

# ------------------------------------------------------------------------------
# 🎚️ ML Guard Configuration (optional)
# Tune ML model sensitivity thresholds (0.0 = permissive, 1.0 = strict)
# ------------------------------------------------------------------------------
ml_guard_config:
  prompt_injection_threshold: 0.5    # Prompt injection detection sensitivity
  toxicity_threshold: 0.5            # Toxic content detection sensitivity
  malicious_url_threshold: 0.75      # Malicious URL detection sensitivity
  ban_code_threshold: 0.5            # Code injection detection sensitivity

# ------------------------------------------------------------------------------
# 🙈 PII Guard Configuration (optional)
# Configure language support and detection settings
# ------------------------------------------------------------------------------
pii_guard_config:
  languages: ["en"]  # Supported: en, es, fr, de, it, pt, nl, etc.
                     # Note: Non-English requires language-specific Presidio models

# ------------------------------------------------------------------------------
# 🚫 Tool Guard Blocklist (Expanded High-Security Profile)
# Based on GTFOBins - These binaries can spawn shells or bypass restrictions.
# ------------------------------------------------------------------------------
tool_guard_profile: balanced   # balanced (default), strict, paranoid

tool_guard_blocklist:
  # Destructive
  - 'rm\s+-[rRf]+'         # Recursive delete
  - 'mkfs'                 # Format disk
  - 'dd\b'                 # Low-level copy (disk wipe)
  - ':\(\)\{\s*:\|:&\s*\};:' # Fork bomb
  - 'chmod\s+777'          # Unsafe permissions
  - 'mv\s+.*\s+/dev/null'  # Destructive move
  
  # Remote Access / Reverse Shells
  - 'nc\b.*-e\b'           # Netcat execution
  - 'bash\s+-i'            # Interactive bash
  - 'sh\s+-i'              # Interactive sh
  - '\bsocat\b'            # Socket Cat
  - '\btelnet\b'           # Telnet
  - '\bssh\b'              # SSH

  # Pipe-to-shell (encoded command execution)
  - '\|\s*(sh|bash|/bin/(ba)?sh)\b'

  # Interpreter abuse with dangerous imports
  - 'python[23]?\s+-c\b.*\b(subprocess|os\.system|os\.popen|os\.exec|socket\.socket|pty\.spawn)'
  - 'perl\s+-e\b.*\b(system|exec|socket)'
  - 'ruby\s+-e\b.*\b(system|exec|socket|IO\.popen)'
  - 'node\s+-e\b.*\b(child_process|execSync|spawn)'

  # Eval-based execution
  - '\beval\b.*\b(base64|decode|echo\s+-e)'

  # Process substitution
  - 'bash\s+<\('

  # File descriptor / network redirection abuse
  - 'exec\s+\d*[<>].*(/dev/tcp|/dev/udp)'

  # Environment variable hijacking
  - 'export\s+(LD_PRELOAD|LD_LIBRARY_PATH|PYTHONPATH|NODE_PATH|PATH)\s*='

  # Indirect execution wrappers
  - '\benv\s+(rm|dd|mkfs|nc|bash|sh)\b'
  - '\bcommand\s+(rm|dd|mkfs|nc|bash|sh)\b'
  - '\$\(which\s+(rm|dd|mkfs|nc)\)'
  - '`which\s+(rm|dd|mkfs|nc)`'

  # Alternative shells
  - '\b(zsh|dash|fish|ksh|csh|tcsh)\s+-c\b'

  # Xargs/parallel with dangerous commands
  - '\bxargs\s+.*(rm|dd|mkfs)\b'
  - '\bparallel\s+.*(rm|dd|mkfs)\b'

  # Find with dangerous actions
  - '\bfind\b.*-delete\b'
  - '\bfind\b.*-exec\s+.*(rm|sh|bash)\b'

  # Here-doc to shell
  - '<<\s*\w*\s*\|?\s*(sh|bash|zsh)\b'

  # Additional interpreter abuse
  - '\bphp\s+-r\b.*\b(system|exec|shell_exec|passthru)'
  - '\blua\s+-e\b.*\bos\.execute\b'
  - '\bawk\b.*\bsystem\s*\('

  # Timeout wrappers with dangerous commands
  - '\b(timeout|time)\s+\d*\s*(rm|dd|mkfs)\b'

  # Source/dot execution of remote content
  - '(?:^|\s)(source|\.)\s+<\('

  # Downloaders (Malware droppers)
  # RELAXED: Allowed by default. NetworkGuard will filter the URLs.
  # - 'wget'
  # - 'curl'

  # ----------------------------------------------------------------------------
  # DEPRECATED: GTFOBins Blocklist
  # User Feedback: "Invalid. These are valid tools."
  # Strategy: Use NetworkGuard (Domains) and WorkspaceGuard (Paths) for context.
  # ----------------------------------------------------------------------------
  # - 'find\b.*-exec'        # find command execution
  # - 'awk\b'                # awk execution
  # - 'sed\b.*-e'            # sed execution
  # - 'vim\b'                # vim shell escape
# ------------------------------------------------------------------------------
# 🏗️ Workspace Guard (Integrity)
# ------------------------------------------------------------------------------
workspace_guard:
  # The root directory the agent is allowed to write to.
  # Default is "." (where the proxy is running).
  workspace_root: "." 

  # Strict Mode: Blocks anything not inside workspace_root.
  # Disabled by default to avoid false-positives in Docker environments.
  # When false, only blocks '..' traversal and dangerous system paths.
  enforce_strict_subpath: false


# ------------------------------------------------------------------------------
# 🌐 Network Guard (NEW)
# Control what the agent connects to.
# ------------------------------------------------------------------------------
network_guard:
  # allow_unknown: What to do with domains not in Tranco top 10K
  # false = strict (block unknown - SECURE DEFAULT)
  # true  = permissive (allow unknown - set this if you get false positives)
  allow_unknown: false

  use_community_list: true         # Tranco top 10K safe domains (auto-allowed)
  use_urlhaus: true                # URLhaus threat feed (28K+ malicious domains)

  allowed_domains:
    # Add domains your agent needs that aren't in Tranco top 10K
    - 'localhost'
    - '127.0.0.1'
    # - 'your-internal-api.corp'

  blocked_domains:
    # URLhaus provides 28K+ known malicious domains automatically.
    # Add custom blocks here:

    # --- Known malicious (examples) ---
    - 'malware.com'
    - 'phishing.site'

    # --- High-risk exfiltration vectors ---
    - 'pastebin.com'          # Paste sites (common exfil target)
    - 'justpaste.it'
    - 'rentry.co'

    # --- Tunnels ---
    - 'ngrok.io'              # Reverse tunnels
    - 'ngrok.com'
    - 'ngrok-free.app'

# ------------------------------------------------------------------------------
# 🙈 PII Redaction
# What should we scrub from your prompts?
# ------------------------------------------------------------------------------
pii_redact:
  - email
  - phone_us
  - ssn
