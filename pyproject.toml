[project]
name = "outclaw"
version = "0.1.0"
description = "The shellriff every lobster needs 🦞🤠 Content security for OpenClaw."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Outclaw Contributors"}]
keywords = ["openclaw", "security", "ai", "agent", "guardrail", "proxy", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "litellm>=1.50.0",
    "PyYAML>=6.0.1",
    "tranco>=0.8.0",
    "detect-secrets>=1.4.0",
    "presidio-analyzer>=2.2.351",
    "presidio-anonymizer>=2.2.351",
    "llamafirewall>=0.1.0",
    "bashlex>=0.18",
    "confusable_homoglyphs>=3.3.0",
    "publicsuffixlist>=1.0.0",
    "phonenumbers>=8.13.0",
]

[project.urls]
Homepage = "https://github.com/npow/outclaw"
Repository = "https://github.com/npow/outclaw"
Issues = "https://github.com/npow/outclaw/issues"

[project.optional-dependencies]
heavy = [
    "llm-guard>=0.3.5",
    "onnxruntime>=1.17.0",
    "optimum[onnxruntime]>=1.17.0",
]
secure = ["keyring>=25.0.0"]

[project.scripts]
outclaw = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "bloom @ git+https://github.com/safety-research/bloom.git",
    "petri @ git+https://github.com/safety-research/petri.git",
]

[tool.pytest.ini_options]
markers = [
    "safety_eval: Bloom + Petri safety evaluations (configure model via --eval-model or EVAL_MODEL env var)",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "drivers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
